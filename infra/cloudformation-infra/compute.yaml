AWSTemplateFormatVersion: '2010-09-09'
Description: TaskFlow Compute Stack - Lambda Function, IAM Role, API Gateway HTTP API

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

  VpcId:
    Type: String
    Description: VPC ID for Lambda networking

  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of private subnet IDs for Lambda VPC config

  LambdaSecurityGroupId:
    Type: String
    Description: Security group ID for Lambda function

  SecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret

  LambdaMemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 3008
    Description: Lambda function memory size in MB

  LambdaTimeout:
    Type: Number
    Default: 30
    MinValue: 3
    MaxValue: 900
    Description: Lambda function timeout in seconds

  LambdaS3Bucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment package

  LambdaS3Key:
    Type: String
    Description: S3 key for the Lambda deployment package

Resources:
  # ============================================================
  # IAM Execution Role for Lambda
  # ============================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'taskflow-${Environment}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub 'taskflow-${Environment}-secrets-access'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref SecretArn
        - PolicyName: !Sub 'taskflow-${Environment}-cloudwatch-logs'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
        - PolicyName: !Sub 'taskflow-${Environment}-vpc-networking'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub 'taskflow-${Environment}-lambda-role'

  # ============================================================
  # Lambda Function
  # ============================================================
  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'taskflow-${Environment}-backend'
      Runtime: python3.11
      Handler: wsgi.handler
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Environment:
        Variables:
          SECRETS_ARN: !Ref SecretArn
      Tags:
        - Key: Name
          Value: !Sub 'taskflow-${Environment}-backend'

  # ============================================================
  # API Gateway HTTP API
  # ============================================================
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'taskflow-${Environment}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
      Tags:
        Name: !Sub 'taskflow-${Environment}-api'

  # ============================================================
  # API Gateway Stage ($default with auto-deploy)
  # ============================================================
  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      Tags:
        Name: !Sub 'taskflow-${Environment}-api-stage'

  # ============================================================
  # Lambda Proxy Integration
  # ============================================================
  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt LambdaFunction.Arn
      PayloadFormatVersion: '2.0'

  # ============================================================
  # Default Route ($default catches all requests)
  # ============================================================
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: '$default'
      Target: !Sub 'integrations/${LambdaIntegration}'

  # ============================================================
  # Lambda Permission for API Gateway
  # ============================================================
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

Outputs:
  ApiInvokeUrl:
    Description: API Gateway invoke URL
    Value: !GetAtt HttpApi.ApiEndpoint

  FunctionName:
    Description: Lambda function name
    Value: !Ref LambdaFunction

  LambdaArn:
    Description: Lambda function ARN
    Value: !GetAtt LambdaFunction.Arn
