AWSTemplateFormatVersion: '2010-09-09'
Description: TaskFlow Secrets Stack - AWS Secrets Manager secret for application credentials

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

  ClusterEndpoint:
    Type: String
    Description: Aurora cluster endpoint address

  ClusterPort:
    Type: String
    Description: Aurora cluster port

  DBName:
    Type: String
    Description: Database name

  DBMasterUsername:
    Type: String
    Description: Database master username

  DBMasterPassword:
    Type: String
    NoEcho: true
    Description: Database master password

  JwtSecretKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: JWT secret key for token signing (minimum 32 characters)

Resources:
  # ============================================================
  # Secrets Manager Secret
  # ============================================================
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'taskflow-${Environment}-secrets'
      Description: !Sub 'Application secrets for taskflow-${Environment}'
      KmsKeyId: 'aws/secretsmanager'
      SecretString: !Sub |
        {
          "DATABASE_URL": "postgresql://${DBMasterUsername}:${DBMasterPassword}@${ClusterEndpoint}:${ClusterPort}/${DBName}",
          "JWT_SECRET_KEY": "${JwtSecretKey}"
        }
      Tags:
        - Key: Name
          Value: !Sub 'taskflow-${Environment}-secrets'

Outputs:
  SecretArn:
    Description: ARN of the Secrets Manager secret
    Value: !Ref AppSecret
