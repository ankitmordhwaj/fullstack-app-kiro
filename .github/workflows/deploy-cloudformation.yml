name: TaskFlow CloudFormation Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  # ====================
  # TEST STAGE
  # ====================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest tests/ -v

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm run test

  # ====================
  # BUILD STAGE
  # ====================
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        run: bash scripts/build_backend.sh

      - name: Build frontend
        run: bash scripts/build_frontend.sh
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.example.com' }}

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-zip
          path: build/backend.zip
          retention-days: 5

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 5

  # ====================
  # DEPLOY STAGE - Dev (auto-deploy on push to main)
  # ====================
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-zip
          path: build/

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Upload backend.zip to S3 deployment bucket
        run: |
          aws s3 cp build/backend.zip "s3://${{ secrets.DEPLOYMENT_S3_BUCKET }}/backend.zip"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/cloudformation-infra/main.yaml \
            --stack-name taskflow-dev \
            --parameter-overrides \
              $(cat infra/cloudformation-infra/parameters/dev.json | jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"') \
              DBMasterPassword=${{ secrets.DB_MASTER_PASSWORD }} \
              JwtSecretKey=${{ secrets.JWT_SECRET_KEY }} \
              LambdaS3Bucket=${{ secrets.DEPLOYMENT_S3_BUCKET }} \
              LambdaS3Key=backend.zip \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Get stack outputs
        id: cfn-outputs
        run: |
          STACK_OUTPUT=$(aws cloudformation describe-stacks --stack-name taskflow-dev --query "Stacks[0].Outputs" --output json)
          echo "s3_bucket=$(echo $STACK_OUTPUT | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "lambda_function=$(echo $STACK_OUTPUT | jq -r '.[] | select(.OutputKey=="LambdaFunctionName") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "cloudfront_id=$(echo $STACK_OUTPUT | jq -r '.[] | select(.OutputKey=="CloudFrontDistributionId") | .OutputValue')" >> "$GITHUB_OUTPUT"

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ steps.cfn-outputs.outputs.lambda_function }}" \
            --s3-bucket "${{ secrets.DEPLOYMENT_S3_BUCKET }}" \
            --s3-key backend.zip

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/dist/ "s3://${{ steps.cfn-outputs.outputs.s3_bucket }}" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cfn-outputs.outputs.cloudfront_id }}" \
            --paths "/*"

  # ====================
  # DEPLOY STAGE - Staging (manual approval required)
  # ====================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-zip
          path: build/

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Upload backend.zip to S3 deployment bucket
        run: |
          aws s3 cp build/backend.zip "s3://${{ secrets.DEPLOYMENT_S3_BUCKET }}/backend.zip"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/cloudformation-infra/main.yaml \
            --stack-name taskflow-staging \
            --parameter-overrides \
              $(cat infra/cloudformation-infra/parameters/staging.json | jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"') \
              DBMasterPassword=${{ secrets.DB_MASTER_PASSWORD }} \
              JwtSecretKey=${{ secrets.JWT_SECRET_KEY }} \
              LambdaS3Bucket=${{ secrets.DEPLOYMENT_S3_BUCKET }} \
              LambdaS3Key=backend.zip \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Get stack outputs
        id: cfn-outputs
        run: |
          STACK_OUTPUT=$(aws cloudformation describe-stacks --stack-name taskflow-staging --query "Stacks[0].Outputs" --output json)
          echo "s3_bucket=$(echo $STACK_OUTPUT | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "lambda_function=$(echo $STACK_OUTPUT | jq -r '.[] | select(.OutputKey=="LambdaFunctionName") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "cloudfront_id=$(echo $STACK_OUTPUT | jq -r '.[] | select(.OutputKey=="CloudFrontDistributionId") | .OutputValue')" >> "$GITHUB_OUTPUT"

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ steps.cfn-outputs.outputs.lambda_function }}" \
            --s3-bucket "${{ secrets.DEPLOYMENT_S3_BUCKET }}" \
            --s3-key backend.zip

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/dist/ "s3://${{ steps.cfn-outputs.outputs.s3_bucket }}" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cfn-outputs.outputs.cloudfront_id }}" \
            --paths "/*"

  # ====================
  # DEPLOY STAGE - Production (manual approval required)
  # ====================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-zip
          path: build/

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Upload backend.zip to S3 deployment bucket
        run: |
          aws s3 cp build/backend.zip "s3://${{ secrets.DEPLOYMENT_S3_BUCKET }}/backend.zip"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file infra/cloudformation-infra/main.yaml \
            --stack-name taskflow-prod \
            --parameter-overrides \
              $(cat infra/cloudformation-infra/parameters/prod.json | jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"') \
              DBMasterPassword=${{ secrets.DB_MASTER_PASSWORD }} \
              JwtSecretKey=${{ secrets.JWT_SECRET_KEY }} \
              LambdaS3Bucket=${{ secrets.DEPLOYMENT_S3_BUCKET }} \
              LambdaS3Key=backend.zip \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Get stack outputs
        id: cfn-outputs
        run: |
          STACK_OUTPUT=$(aws cloudformation describe-stacks --stack-name taskflow-prod --query "Stacks[0].Outputs" --output json)
          echo "s3_bucket=$(echo $STACK_OUTPUT | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "lambda_function=$(echo $STACK_OUTPUT | jq -r '.[] | select(.OutputKey=="LambdaFunctionName") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "cloudfront_id=$(echo $STACK_OUTPUT | jq -r '.[] | select(.OutputKey=="CloudFrontDistributionId") | .OutputValue')" >> "$GITHUB_OUTPUT"

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "${{ steps.cfn-outputs.outputs.lambda_function }}" \
            --s3-bucket "${{ secrets.DEPLOYMENT_S3_BUCKET }}" \
            --s3-key backend.zip

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/dist/ "s3://${{ steps.cfn-outputs.outputs.s3_bucket }}" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cfn-outputs.outputs.cloudfront_id }}" \
            --paths "/*"
